name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore LinkFlow.csproj

    - name: Build Debug
      run: dotnet build LinkFlow.csproj -c Debug --no-restore

    - name: Publish Framework-Dependent Portable (Lightweight)
      run: >
        dotnet publish LinkFlow.csproj -c Release -r win-x64 --no-self-contained
        -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./dist/portable

    - name: Publish Self-Contained Standalone (ReadyToRun)
      run: >
        dotnet publish LinkFlow.csproj -c Release -r win-x64 --self-contained true
        -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./dist/standalone

    - name: Create Release Archives
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        Compress-Archive -Path ./dist/portable/* -DestinationPath ./dist/LinkFlow-portable-x64.zip -Force
        Compress-Archive -Path ./dist/standalone/* -DestinationPath ./dist/LinkFlow-standalone-x64.zip -Force

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./dist/LinkFlow-portable-x64.zip
          ./dist/LinkFlow-standalone-x64.zip
          ./dist/portable/LinkFlow.exe
        draft: false
        prerelease: false
        generate_release_notes: true
